[project]
name = "comfy-moss-image-kv-cache"
version = "0.1.0"
description = "Fixed-timestep text KV caching for native ComfyUI MOSS-Image models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.17.1"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
